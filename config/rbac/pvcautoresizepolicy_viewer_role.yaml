# This rule is not used by the project pvc-autoresizer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to autoresize.csiaddons.openshift.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pvc-autoresizer
    app.kubernetes.io/managed-by: kustomize
  name: pvcautoresizepolicy-viewer-role
rules:
- apiGroups:
  - autoresize.csiaddons.openshift.io
  resources:
  - pvcautoresizepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoresize.csiaddons.openshift.io
  resources:
  - pvcautoresizepolicies/status
  verbs:
  - get
