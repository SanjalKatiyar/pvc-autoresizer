---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - autoresize.csiaddons.openshift.io
  resources:
  - pvcautoresizepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoresize.csiaddons.openshift.io
  resources:
  - pvcautoresizepolicies/finalizers
  verbs:
  - update
- apiGroups:
  - autoresize.csiaddons.openshift.io
  resources:
  - pvcautoresizepolicies/status
  verbs:
  - get
  - patch
  - update
