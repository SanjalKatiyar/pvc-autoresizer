apiVersion: autoresize.csiaddons.openshift.io/v1alpha1
kind: PVCAutoResizePolicy
metadata:
  labels:
    app.kubernetes.io/name: pvc-autoresizer
    app.kubernetes.io/managed-by: kustomize
  name: pvcautoresizepolicy-sample
spec:
  suspend: false
  provisioner: example.csi.driver
  selectors:
    namespace:
      labelSelector:
        matchLabels:
          environment: production
    persistentVolumeClaim:
      labelSelector:
        matchLabels:
          autoresize: "true"
  expansionThresholds:
    usagePercentage: 80
    usageInodePercentage: 80
    increasePercentage: 10
    # increaseAbsolute: 50Gi
    # maxCapacity: 2Ti
